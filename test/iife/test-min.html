<html lang="en">
<meta charset="UTF-8" />
<head>
  <title>Vuetrex test</title>
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <h1>Testing Vuetrex</h1>
  <span>{{msg}}</span>
  <Vuetrex>
    <vx-layer>
      <vx-row>
        <vx-box name="a1" @click="myClick"/>
      </vx-row>
      <vx-row>
        <vx-box name="a2" size="2.0"/>
      </vx-row>
      <vx-row>
        <vx-cylinder name="a3" size="2.0"/>
      </vx-row>
    </vx-layer>
  </Vuetrex>
</div>
<script type="module">
    import { createApp, ref, onMounted} from 'vue';
    import { Vuetrex } from '../../dist/vuetrex.es.js';

    const RootComponent = {
        components: {
            Vuetrex: Vuetrex
        },
        setup() {
            console.log("Vuetrex loaded:",Vuetrex)

            const msg = ref("loading")
            const counter = ref(0)

            function myClick() {
              msg.value = "First box clicked " + (++counter.value)
            }

            onMounted(() => {
                msg.value = 'loaded'
            })

            return { msg, myClick }
        }
    };
    const app = createApp(RootComponent);
    app.mount('#app');

</script>
</body>
</html>
